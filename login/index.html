<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identificação | Meu Analytics Labs</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
    <style>
        body { background-color: #ffffff; color: #333; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .auth-logo-header { text-align: center; padding: 25px 0; border-bottom: 1px solid #e5e7eb; background: #ffffff; }
        .auth-container { max-width: 1100px; margin: 40px auto; padding: 0 20px; display: flex; gap: 50px; justify-content: center; align-items: flex-start; }
        .auth-column { flex: 1; background: #ffffff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 35px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02); min-width: 300px; }
        .auth-column-title { text-align: center; font-size: 22px; font-weight: bold; color: #111827; margin-bottom: 25px; }
        .auth-icon-badge { width: 45px; height: 45px; background: #f3f4f6; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px auto; font-size: 20px; color: #0066ff; border: 1px solid #e5e7eb; }
        .form-group-auth { margin-bottom: 18px; }
        .form-group-auth label { display: block; font-weight: 600; font-size: 14px; color: #374151; margin-bottom: 6px; }
        .form-group-auth input { width: 100%; padding: 11px 14px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 14px; box-sizing: border-box; }
        .btn-auth-submit { width: 100%; background: #0066ff; color: #ffffff !important; border: none; padding: 14px; border-radius: 4px; font-weight: bold; font-size: 15px; cursor: pointer; text-align: center; text-decoration: none; display: block; }
        .social-btn-fake { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 4px; background: white; font-size: 13px; font-weight: 600; color: #4b5563; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 12px; cursor: not-allowed; opacity: 0.8; }
        .social-btn-fake.fb { background: #3b5998; color: white; border: none; }
        .divider-text { text-align: center; margin: 15px 0; color: #9ca3af; font-size: 12px; }
        .alert-box-auth { padding: 12px; border-radius: 4px; margin-bottom: 20px; font-size: 14px; display: none; text-align: center; }
        .alert-success { background: #d1fae5; color: #065f46; border: 1px solid #6ee7b7; display: block !important; }
        .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; display: block !important; }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="auth-logo-header">
        <a href="https://cursos.meuanalytics.com.br/nossos-cursos/" style="text-decoration: none;">
            <div class="logo" style="font-size: 24px;"><span class="logo-accent">MEU</span> ANALYTICS <span class="logo-sub">LABS</span></div>
        </a>
    </div>

    <main class="auth-container">
        <section class="auth-column">
            <div class="auth-icon-badge">🪪</div>
            <h2 class="auth-column-title">Cadastre-se para continuar</h2>
            <button type="button" class="social-btn-fake fb">Continuar com Facebook</button>
            <button type="button" class="social-btn-fake">🌐 Continuar com Google</button>
            <div class="divider-text">ou preencha os dados abaixo</div>
            <div id="register-alert" class="alert-box-auth"></div>
            <form id="register-form" onsubmit="handleRegister(event)">
                <div class="form-group-auth">
                    <label>Nome</label>
                    <input type="text" id="reg-name" required placeholder="Seu nome completo">
                </div>
                <div class="form-group-auth">
                    <label>E-mail</label>
                    <input type="email" id="reg-email" required placeholder="seuemail@exemplo.com">
                </div>
                <div class="form-group-auth">
                    <label>Celular</label>
                    <input type="tel" id="reg-phone" required placeholder="(63) 98888-8888">
                </div>
                <div class="form-group-auth">
                    <label>Senha</label>
                    <input type="password" id="reg-password" required placeholder="Mínimo 6 caracteres" minlength="6">
                </div>
                <button type="submit" class="btn-auth-submit" id="btn-register">Cadastrar e continuar</button>
            </form>
        </section>

        <section class="auth-column">
            <div class="auth-icon-badge">🛡️</div>
            <h2 class="auth-column-title">Se já tiver uma conta, faça seu login</h2>
            <button type="button" class="social-btn-fake fb">Continuar com Facebook</button>
            <button type="button" class="social-btn-fake">🌐 Continuar com Google</button>
            <div class="divider-text">ou entre com sua conta</div>
            <div id="login-alert" class="alert-box-auth"></div>
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group-auth">
                    <label>E-mail</label>
                    <input type="email" id="log-email" required placeholder="seuemail@exemplo.com">
                </div>
                <div class="form-group-auth">
                    <label>Senha</label>
                    <input type="password" id="log-password" required placeholder="Sua senha cadastrada">
                </div>
                <button type="submit" class="btn-auth-submit" id="btn-login">Entrar e continuar</button>
            </form>
        </section>
    </main>

    <script>
        // 1. INICIALIZAÇÃO DO CLIENTE SUPABASE (VERSÃO BLINDADA COM COOKIES COLETIVOS)
        const SUPABASE_URL = "https://lcslqpdoidgteihcxjqr.supabase.co";
        const SUPABASE_KEY = "sb_publishable_WnJunLw2RbK4yVjkN2r8IA_j_NWO3El";

        // Ajustado para o domínio de testes locais do seu arquivo hosts
        const COOKIE_DOMAIN = ".meuanalytics.local"; 

        const supabaseOptions = {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: false,
                storage: {
                    getItem: (key) => {
                        const value = document.cookie.match('(^|;)\\s*' + key + '\\s*=\\s*([^;]+)');
                        return value ? decodeURIComponent(value.pop()) : null;
                    },
                    setItem: (key, value) => {
                        document.cookie = `${key}=${encodeURIComponent(value)}; path=/; domain=${COOKIE_DOMAIN}; max-age=31536000; samesite=lax`;
                    },
                    removeItem: (key) => {
                        document.cookie = `${key}=; path=/; domain=${COOKIE_DOMAIN}; expires=Thu, 01 Jan 1970 00:00:00 GMT`;
                    }
                }
            },
            global: {
                headers: { 'X-Client-Info': 'supabase-js-web' }
            }
        };

        // Alterado de 'supabase' para 'supabaseClient' para evitar conflito com a global da CDN
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, supabaseOptions);

        // 2. O GANCHO DO CARREGAMENTO TARDIO (A ORDEM CRONOLÓGICA)
        supabaseClient.auth.getSession().then(({ data: { session } }) => {
            window.dataLayer = window.dataLayer || [];

            if (session && session.user) {
                window.dataLayer.push({
                    'user_id': session.user.id
                });
                console.log("Supabase: Usuário identificado na carga inicial ->", session.user.id);
            } else {
                window.dataLayer.push({
                    'user_id': null
                });
                console.log("Supabase: Usuário Anônimo na carga inicial.");
            }

            console.log("GTM Liberado para carregar agora!");

        }).catch((error) => {
            console.error("Erro na verificação inicial do Supabase:", error);
            window.dataLayer = window.dataLayer || [];
            window.dataLayer.push({ 'user_id': null });
            console.log("GTM Liberado por contingência (Erro Supabase).");
        });

        // 3. FUNÇÃO UNIFICADA PARA REDIRECIONAMENTO POST-AUTH
        function redirectPostAuth() {
            const temItemNoCarrinho = sessionStorage.getItem('item_no_carrinho');
            if (temItemNoCarrinho !== null) {
                window.location.replace("https://meuanalytics.com.br/pagamento/index.html");
            } else {
                window.location.replace("https://cursos.meuanalytics.com.br/");
            }
        }

        // 4. FUNÇÃO AUXILIAR PARA ALIMENTAR O DATA LAYER DO GTM (DISPARADA APENAS NO CLIQUE)
        function dispararIdentidadeNoDataLayer(userId, email, statusUsuario) {
            window.dataLayer = window.dataLayer || [];
            window.dataLayer.push({
                'event': 'user_identified',
                'user_id': userId,
                'user_email': email,
                'user_status': statusUsuario
            });
            console.log(`Evento 'user_identified' enviado pro dataLayer (${statusUsuario})`);
        }

        // 5. LÓGICA DE CADASTRO (SIGN UP)
        async function handleRegister(event) {
            event.preventDefault();
            
            const btn = document.getElementById('btn-register');
            const alertBox = document.getElementById('register-alert');
            
            const nome = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const telefone = document.getElementById('reg-phone').value;
            const password = document.getElementById('reg-password').value;

            btn.disabled = true;
            btn.innerText = "Processando...";
            alertBox.style.display = "none";

            const { data: authData, error: authError } = await supabaseClient.auth.signUp({
                email: email,
                password: password
            });

            if (authError) {
                alertBox.className = "alert-box-auth alert-error";
                alertBox.innerText = `Erro no cadastro: ${authError.message}`;
                alertBox.style.display = "block";
                btn.disabled = false;
                btn.innerText = "Cadastrar e continuar";
                return;
            }

            const userIdGerado = authData.user.id;

            const { error: profileError } = await supabaseClient
                .from('perfis_alunos')
                .insert([
                    { id: userIdGerado, email: email, nome: nome, telefone: telefone }
                ]);

            if (profileError) {
                alertBox.className = "alert-box-auth alert-error";
                alertBox.innerText = `Erro ao salvar dados do perfil: ${profileError.message}`;
                alertBox.style.display = "block";
                btn.disabled = false;
                btn.innerText = "Cadastrar e continuar";
                return;
            }

            sessionStorage.setItem('user_id', userIdGerado);
            sessionStorage.setItem('user_email', email);

            dispararIdentidadeNoDataLayer(userIdGerado, email, "novo");

            alertBox.className = "alert-box-auth alert-success";
            alertBox.innerText = "Conta criada com sucesso! Redirecionando...";
            alertBox.style.display = "block";

            setTimeout(redirectPostAuth, 1000);
        }

        // 6. LÓGICA DE LOGIN (SIGN IN)
        async function handleLogin(event) {
            event.preventDefault();

            const btn = document.getElementById('btn-login');
            const alertBox = document.getElementById('login-alert');
            
            const email = document.getElementById('log-email').value;
            const password = document.getElementById('log-password').value;

            btn.disabled = true;
            btn.innerText = "Autenticando...";
            alertBox.style.display = "none";

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                alertBox.className = "alert-box-auth alert-error";
                alertBox.innerText = `Acesso negado: ${error.message}`;
                alertBox.style.display = "block";
                btn.disabled = false;
                btn.innerText = "Entrar e continuar";
                return;
            }

            const userIdExistente = data.user.id;

            sessionStorage.setItem('user_id', userIdExistente);
            sessionStorage.setItem('user_email', email);

            dispararIdentidadeNoDataLayer(userIdExistente, email, "existente");

            alertBox.className = "alert-box-auth alert-success";
            alertBox.innerText = "Acesso autorizado! Redirecionando...";
            alertBox.style.display = "block";

            setTimeout(redirectPostAuth, 1000);
        }
    </script>
</body>
</html>
